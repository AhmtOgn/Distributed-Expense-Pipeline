<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Employees</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="mb-0">Employees</h3>
        <div>
            <a th:href="@{/}" class="btn btn-sm"
               th:classappend="${selectedDept == null} ? 'btn-primary' : 'btn-outline-primary'">All</a>
            <a th:each="d : ${depts}"
               th:href="@{/(deptno=${d.deptno})}"
               th:text="${d.dname}"
               class="btn btn-sm ms-1"
               th:classappend="${selectedDept == d.deptno} ? 'btn-primary' : 'btn-outline-primary'"></a>
        </div>
    </div>

    <div class="card shadow-sm">
        <table class="table table-hover align-middle mb-0">
            <thead class="table-dark">
            <tr>
                <th>Photo</th>
                <th>ID</th>
                <th>Name</th>
                <th>Job</th>
                <th>Department</th>
                <th>Salary</th>
                <th>Action</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(emps)}">
                <td colspan="7" class="text-center text-muted py-4">No employees found in this department.</td>
            </tr>
            <tr th:each="e : ${emps}">
                <td>
                    <img th:if="${e.img != null}" th:src="@{/image/{img}(img=${e.img})}"
                         width="48" height="48" class="rounded-circle object-fit-cover border" alt="Employee Photo">
                </td>
                <td th:text="${e.empno}"></td>
                <td class="fw-bold" th:text="${e.ename}"></td>
                <td th:text="${e.job}"></td>
                <td><span class="badge bg-secondary" th:text="${e.dept != null ? e.dept.dname : '-'}"></span></td>
                <td th:text="'$' + ${e.sal}"></td>
                <td>
                    <a th:href="@{/emp/{id}(id=${e.empno})}" class="btn btn-sm btn-success">View Expenses</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
