<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Employee Expenses</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-light">
<div class="container py-4">
    <div class="mb-3 d-flex justify-content-between">
        <a th:href="@{/}" class="btn btn-outline-secondary btn-sm">&larr; Back to Employees</a>
        <a th:href="@{/emp/{id}(id=${emp.empno})}" class="btn btn-primary btn-sm">Refresh</a>
    </div>

    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <div class="row align-items-center g-3">
                <!-- Left: Profile Info -->
                <div class="col-lg-5 d-flex align-items-center">
                    <img th:if="${emp.img != null}" th:src="@{/image/{img}(img=${emp.img})}"
                         width="88" height="88" class="rounded-circle object-fit-cover border me-3" alt="Employee Photo">
                    <div>
                        <h4 class="mb-1" th:text="${emp.ename} + ' (#' + ${emp.empno} + ')'"></h4>
                        <p class="mb-0 text-muted small">
                            <span th:text="${emp.job}"></span> &bull;
                            <span th:text="${emp.dept != null ? emp.dept.dname + ' (' + emp.dept.loc + ')' : '-'}"></span><br>
                            Salary: <strong th:text="'$' + ${emp.sal}"></strong>
                        </p>
                    </div>
                </div>

                <!-- Middle: Category Pie Chart -->
                <div class="col-lg-4 d-flex justify-content-center">
                    <div th:if="${!#lists.isEmpty(expenses)}" style="width: 100%; max-width: 280px; height: 150px;">
                        <canvas id="categoryChart"></canvas>
                    </div>
                    <div th:if="${#lists.isEmpty(expenses)}" class="text-muted small">
                        No category data
                    </div>
                </div>

                <!-- Right: Total Spent -->
                <div class="col-lg-3 text-lg-end">
                    <div class="text-muted small">
                        Total Spent (<span th:text="${#lists.size(expenses)}"></span> items)
                    </div>
                    <h3 class="text-danger mb-0" th:text="'$' + ${#numbers.formatDecimal(totalPayment, 1, 2)}"></h3>
                </div>
            </div>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-header bg-dark text-white">Expense History</div>
        <table class="table table-striped mb-0">
            <thead>
            <tr>
                <th>Date &amp; Time</th>
                <th>Description</th>
                <th>Category</th>
                <th>Qty</th>
                <th class="text-end">Amount</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(expenses)}">
                <td colspan="5" class="text-center text-muted py-4">No expenses recorded for this employee yet.</td>
            </tr>
            <tr th:each="ex : ${expenses}">
                <td th:text="${ex.dateTime}"></td>
                <td th:text="${ex.description}"></td>
                <td><span class="badge bg-info text-dark" th:text="${ex.type}"></span></td>
                <td th:text="${ex.count}"></td>
                <td class="text-end fw-bold" th:text="'$' + ${#numbers.formatDecimal(ex.payment, 1, 2)}"></td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<script th:if="${!#lists.isEmpty(expenses)}" th:inline="javascript">
    const labels = /*[[${categoryLabels}]]*/ [];
    const values = /*[[${categoryValues}]]*/ [];

    const colorMap = {
        'Food': '#198754',
        'Appliances': '#0d6efd',
        'Entertainment': '#ffc107',
        'Hardware': '#dc3545'
    };
    const fallbackColors = ['#6f42c1', '#20c997', '#fd7e14', '#6c757d'];
    const backgroundColors = labels.map((label, idx) =>
        colorMap[label] || fallbackColors[idx % fallbackColors.length]
    );

    const ctx = document.getElementById('categoryChart').getContext('2d');
    new Chart(ctx, {
        type: 'pie',
        data: {
            labels: labels,
            datasets: [{
                data: values,
                backgroundColor: backgroundColors,
                borderWidth: 1
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: {
                    position: 'right',
                    labels: {
                        boxWidth: 12,
                        font: { size: 11 }
                    }
                },
                tooltip: {
                    callbacks: {
                        label: function(context) {
                            const val = context.parsed || 0;
                            return ` ${context.label}: $${val.toFixed(2)}`;
                        }
                    }
                }
            }
        }
    });
</script>
</body>
</html>
