<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Harcama Ekstresi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
    <div class="mb-3 d-flex justify-content-between">
        <a th:href="@{/}" class="btn btn-outline-secondary btn-sm">&larr; Çalışan Listesine Dön</a>
        <a th:href="@{/emp/{id}(id=${emp.empno})}" class="btn btn-primary btn-sm">Canlı Yenile (Spark &rarr; Cassandra)</a>
    </div>

    <div class="card shadow-sm mb-4">
        <div class="card-body d-flex align-items-center justify-content-between">
            <div class="d-flex align-items-center">
                <img th:if="${emp.img != null}" th:src="@{/image/{img}(img=${emp.img})}"
                     width="90" height="90" class="rounded-circle object-fit-cover border me-4">
                <div>
                    <h4 class="mb-1" th:text="${emp.ename} + ' (#' + ${emp.empno} + ')'"></h4>
                    <p class="mb-0 text-muted">
                        <span th:text="${emp.job}"></span> |
                        <span th:text="${emp.dept != null ? emp.dept.dname + ' - ' + emp.dept.loc : ''}"></span> |
                        Maaş: <strong th:text="${emp.sal} + ' $'"></strong>
                    </p>
                </div>
            </div>
            <div class="text-end">
                <div class="text-muted small">Toplam Harcama (<span th:text="${#lists.size(expenses)}"></span> işlem)</div>
                <h3 class="text-danger mb-0" th:text="${#numbers.formatDecimal(totalPayment, 1, 2)} + ' $'"></h3>
            </div>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-header bg-dark text-white">Canlı Harcama Geçmişi (Cassandra: test.expenses)</div>
        <table class="table table-striped mb-0">
            <thead>
            <tr>
                <th>Tarih / Saat</th>
                <th>Açıklama</th>
                <th>Kategori</th>
                <th>Adet</th>
                <th class="text-end">Tutar</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(expenses)}">
                <td colspan="5" class="text-center text-muted py-4">Bu çalışana ait henüz POS harcaması bulunmuyor.</td>
            </tr>
            <tr th:each="ex : ${expenses}">
                <td th:text="${ex.dateTime}"></td>
                <td th:text="${ex.description}"></td>
                <td><span class="badge bg-info text-dark" th:text="${ex.type}"></span></td>
                <td th:text="${ex.count}"></td>
                <td class="text-end fw-bold" th:text="${#numbers.formatDecimal(ex.payment, 1, 2)} + ' $'"></td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
